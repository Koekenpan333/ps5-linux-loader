name: Build PS5 Linux Loader

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            git \
            cmake \
            python3 \
            python3-pip \
            clang \
            lld \
            llvm

      - name: Clone PS5 Payload SDK
        run: |
          git clone --depth 1 \
            https://github.com/ps5-payload-dev/sdk.git \
            "$RUNNER_TEMP/ps5-payload-sdk"

      - name: Verify SDK build instructions
        run: |
          cd "$RUNNER_TEMP/ps5-payload-sdk"

          echo "SDK repository contents:"
          ls -la

          if [ ! -f toolchain/prospero.mk ]; then
            echo "::error::The cloned repository does not contain toolchain/prospero.mk"
            echo "The SDK repository or installation procedure must be corrected."
            exit 1
          fi

      - name: Configure SDK environment
        run: |
          echo "PS5_PAYLOAD_SDK=$RUNNER_TEMP/ps5-payload-sdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ps5-payload-sdk/bin" >> "$GITHUB_PATH"

      - name: Verify project Makefile
        run: |
          test -f Makefile
          test -d source
          echo "Project files found."

      - name: Build project
        run: |
          make -j"$(nproc)"

      - name: Verify build output
        run: |
          if [ ! -f bin/ps5-linux-loader.elf ]; then
            echo "::error::Build output bin/ps5-linux-loader.elf was not generated."
            exit 1
          fi

          file bin/ps5-linux-loader.elf

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps5-linux-loader
          path: bin/ps5-linux-loader.elf
          if-no-files-found: error
