name: Build PS5 Linux Loader

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            git \
            cmake \
            python3 \
            python3-pip \
            clang \
            lld \
            llvm

      - name: Clone PS5 Payload SDK
        run: |
          git clone --depth 1 \
            https://github.com/ps5-payload-dev/sdk.git \
            "$RUNNER_TEMP/ps5-payload-sdk-src"

      - name: Inspect SDK build instructions
        run: |
          cd "$RUNNER_TEMP/ps5-payload-sdk-src"
          echo "SDK Makefile:"
          sed -n '1,180p' Makefile
          echo "SDK README:"
          sed -n '1,160p' README.md

      - name: Build and install PS5 Payload SDK
        run: |
          cd "$RUNNER_TEMP/ps5-payload-sdk-src"
          make -j"$(nproc)"
          sudo make install

      - name: Locate SDK toolchain
        run: |
          find "$RUNNER_TEMP/ps5-payload-sdk-src" /opt \
            -name prospero.mk -o -name prospero-clang \
            2>/dev/null | head -50

      - name: Configure SDK environment
        run: |
          echo "PS5_PAYLOAD_SDK=$RUNNER_TEMP/ps5-payload-sdk-src" >> "$GITHUB_ENV"

      - name: Build project
        run: |
          make -j"$(nproc)"

      - name: Verify build output
        run: |
          test -f bin/ps5-linux-loader.elf
          file bin/ps5-linux-loader.elf

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps5-linux-loader
          path: bin/ps5-linux-loader.elf
          if-no-files-found: error
