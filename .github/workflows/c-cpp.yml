name: Build PS5 Linux Loader

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            git \
            cmake \
            python3 \
            python3-pip \
            clang-18 \
            lld-18

      - name: Clone and install PS5 Payload SDK
        run: |
          git clone --depth 1 \
            https://github.com/ps5-payload-dev/sdk.git \
            "$RUNNER_TEMP/ps5-payload-sdk-src"

          sudo make -C "$RUNNER_TEMP/ps5-payload-sdk-src" \
            DESTDIR=/opt/ps5-payload-sdk install

          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Verify SDK installation
        run: |
          if [ ! -f "$PS5_PAYLOAD_SDK/toolchain/prospero.mk" ]; then
            echo "::error::prospero.mk was not installed."
            find /opt/ps5-payload-sdk -maxdepth 4 -type f | head -50
            exit 1
          fi

          if [ ! -x "$PS5_PAYLOAD_SDK/bin/prospero-clang" ]; then
            echo "::error::prospero-clang was not installed."
            exit 1
          fi

          echo "PS5 Payload SDK installed successfully."

      - name: Build project
        run: |
          make -j"$(nproc)"

      - name: Verify build output
        run: |
          test -f bin/ps5-linux-loader.elf
          file bin/ps5-linux-loader.elf

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps5-linux-loader
          path: bin/ps5-linux-loader.elf
          if-no-files-found: error
